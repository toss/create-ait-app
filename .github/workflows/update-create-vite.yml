name: create-vite 업데이트

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: update-create-vite
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: create-vite 업데이트
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Corepack 활성화
        run: corepack enable

      - name: 의존성 설치
        run: yarn install --immutable

      - name: 최신 create-vite 버전 확인
        id: version
        run: |
          current="$(node -p "require('./package.json').dependencies['create-vite']")"
          latest="$(npm view create-vite version)"
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 고정된 의존성 업데이트
        if: steps.version.outputs.changed == 'true'
        run: yarn up "create-vite@${{ steps.version.outputs.latest }}"

      - name: 품질 검사
        if: steps.version.outputs.changed == 'true'
        run: yarn check

      - name: 모든 지원 프리셋 스캐폴딩 테스트
        if: steps.version.outputs.changed == 'true'
        env:
          AIT_E2E_TEMPLATES: all
        run: yarn test:e2e

      - name: PR 만들기
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.version.outputs.latest }}
          PR_BODY: |
            ## 요약

            create-vite를 ${{ steps.version.outputs.latest }}로 업데이트해요.

            ## 검증

            - lint
            - format check
            - typecheck
            - Vitest unit tests
            - tsdown build 및 publint
            - create-vite에서 동적으로 찾은 모든 정적 클라이언트 프리셋과 TDS의 스캐폴딩, build, dev 테스트

            매일 실행하는 자동 호환성 검증을 모두 통과한 뒤 만든 PR이에요.
        run: |
          branch="chore/create-vite-${LATEST}"
          existing="$(gh pr list --state open --head "$branch" --json url --jq '.[0].url // empty')"
          if [ -n "$existing" ]; then
            echo "Open pull request already exists: $existing"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add package.json yarn.lock
          git commit -m "chore: create-vite ${LATEST}로 업데이트"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: create-vite ${LATEST}로 업데이트" \
            --body "$PR_BODY"
