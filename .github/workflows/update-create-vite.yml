name: create-vite 업데이트

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: update-create-vite
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: 최신 버전 확인
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 최신 create-vite 버전 확인
        id: version
        run: |
          current="$(node -p "require('./package.json').dependencies['create-vite']")"
          latest="$(npm view create-vite version)"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 포맷
            command: yarn format:check
          - name: 린트
            command: yarn lint
          - name: 타입 검사
            command: yarn typecheck
          - name: 단위 테스트
            command: yarn test
          - name: 패키지 빌드
            command: yarn build && yarn publint
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Corepack 활성화
        run: corepack enable

      - name: 의존성 설치
        run: yarn install --immutable

      - name: create-vite 업데이트
        run: yarn up "create-vite@${{ needs.version.outputs.latest }}"

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  scaffolding-matrix:
    name: 스캐폴딩 테스트 준비
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.templates.outputs.templates }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Corepack 활성화
        run: corepack enable

      - name: 의존성 설치
        run: yarn install --immutable

      - name: create-vite 업데이트
        run: yarn up "create-vite@${{ needs.version.outputs.latest }}"

      - name: 패키지 빌드
        run: yarn build

      - name: 스캐폴딩 테스트 대상 확인
        id: templates
        run: |
          templates="$(yarn node --input-type=module -e 'import { getSupportedViteTemplates } from "./dist/index.mjs"; process.stdout.write(JSON.stringify([...getSupportedViteTemplates(), "tds"]))')"
          echo "templates=${templates}" >> "$GITHUB_OUTPUT"

  scaffolding-tests:
    name: 스캐폴딩 테스트 (${{ matrix.template }})
    needs:
      - version
      - scaffolding-matrix
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.scaffolding-matrix.outputs.templates) }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Corepack 활성화
        run: corepack enable

      - name: 의존성 설치
        run: yarn install --immutable

      - name: create-vite 업데이트
        run: yarn up "create-vite@${{ needs.version.outputs.latest }}"

      - name: 프로젝트 생성, 빌드, .ait 산출물, 개발 서버 검증
        env:
          AIT_E2E_TEMPLATES: ${{ matrix.template }}
          AIT_E2E_SAMPLES: ${{ (matrix.template == 'react' || matrix.template == 'react-ts' || matrix.template == 'vanilla' || matrix.template == 'vanilla-ts' || matrix.template == 'tds') && 'iap,iaa' || '' }}
        run: yarn test:e2e

  create-pr:
    name: PR 만들기
    needs:
      - version
      - checks
      - scaffolding-tests
    if: >-
      always() &&
      needs.version.outputs.changed == 'true' &&
      needs.checks.result == 'success' &&
      needs.scaffolding-tests.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Corepack 활성화
        run: corepack enable

      - name: 의존성 설치
        run: yarn install --immutable

      - name: create-vite 업데이트
        run: yarn up "create-vite@${{ needs.version.outputs.latest }}"

      - name: PR 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ needs.version.outputs.latest }}
          PR_BODY: |
            ## 요약

            create-vite를 ${{ needs.version.outputs.latest }}로 업데이트해요.

            ## 검증

            - 포맷
            - 린트
            - 타입 검사
            - Vitest 단위 테스트
            - tsdown 빌드 및 publint
            - create-vite에서 동적으로 찾은 모든 정적 클라이언트 프리셋과 TDS의 스캐폴딩, build, `.ait` 산출물, dev 테스트

            매일 실행하는 자동 호환성 검증을 모두 통과한 뒤 만든 PR이에요.
        run: |
          branch="chore/create-vite-${LATEST}"
          existing="$(gh pr list --state open --head "$branch" --json url --jq '.[0].url // empty')"
          if [ -n "$existing" ]; then
            echo "Open pull request already exists: $existing"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add package.json yarn.lock
          git commit -m "chore: create-vite ${LATEST}로 업데이트"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: create-vite ${LATEST}로 업데이트" \
            --body "$PR_BODY"
