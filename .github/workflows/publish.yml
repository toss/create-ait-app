name: Publish to npm

on:
  push:
    branches:
      - main

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check if version changed
        id: version
        run: |
          if git diff HEAD~1 HEAD -- package.json | grep -qE '^[+-].*"version"'; then
            VERSION=$(node -p "require('./package.json').version")
            echo "Version changed to ${VERSION}."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "package.json version unchanged. Skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Enable Corepack
        if: steps.version.outputs.publish == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: yarn install --immutable

      - name: Validate version
        if: steps.version.outputs.publish == 'true'
        id: release
        run: yarn node .github/scripts/validate-version.mjs

      - name: Check if version is already published
        if: steps.version.outputs.publish == 'true'
        id: should_publish
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          if npm view "create-ait-app@${VERSION}" version >/dev/null 2>&1; then
            echo "create-ait-app@${VERSION} is already on npm. Skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "create-ait-app@${VERSION} is not published yet."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate package
        if: steps.version.outputs.publish == 'true'
        run: |
          yarn format:check
          yarn lint
          yarn typecheck
          yarn test
          yarn build
          yarn publint

      - name: Collect release notes
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/collect-release-notes.mjs "${{ steps.version.outputs.value }}" > release-notes.md
          echo "Release notes:"
          cat release-notes.md

      - name: Publish to npm
        if: steps.should_publish.outputs.publish == 'true'
        run: npm publish --tag "${{ steps.release.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          TAG="v${VERSION}"
          RELEASE_FLAGS=()

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Skipping."
            exit 0
          fi

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${RELEASE_FLAGS[@]}"
