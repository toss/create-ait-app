name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  quality:
    name: 품질 검사
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Corepack 활성화
        run: corepack enable

      - name: 의존성 설치
        run: yarn install --immutable

      - name: 포맷 검사
        run: yarn format:check

      - name: 린트
        run: yarn lint

      - name: 타입 검사
        run: yarn typecheck

      - name: 단위 테스트
        run: yarn test

      - name: 패키지 빌드 및 검증
        run: |
          yarn build
          yarn publint

  scaffolding-matrix:
    name: 스캐폴딩 테스트 준비
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.templates.outputs.templates }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Corepack 활성화
        run: corepack enable

      - name: 의존성 설치
        run: yarn install --immutable

      - name: 패키지 빌드
        run: yarn build

      - name: 스캐폴딩 테스트 대상 확인
        id: templates
        run: |
          templates="$(yarn node --input-type=module -e 'import { getSupportedViteTemplates } from "./dist/index.mjs"; process.stdout.write(JSON.stringify([...getSupportedViteTemplates(), "tds"]))')"
          echo "templates=${templates}" >> "$GITHUB_OUTPUT"

  scaffolding-tests:
    name: 스캐폴딩 테스트 (${{ matrix.template }})
    needs: scaffolding-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJSON(needs.scaffolding-matrix.outputs.templates) }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Corepack 활성화
        run: corepack enable

      - name: 의존성 설치
        run: yarn install --immutable

      - name: 프로젝트 생성, 빌드, 개발 서버 검증
        env:
          AIT_E2E_TEMPLATES: ${{ matrix.template }}
          AIT_E2E_SAMPLES: ${{ matrix.template == 'tds' && 'iap,iaa' || '' }}
        run: yarn test:e2e
