version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 * * *"
      timezone: Asia/Seoul
    allow:
      - dependency-name: create-vite
    cooldown:
      exclude:
        - create-vite
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /.github/version-pins
    schedule:
      interval: cron
      cronjob: "0 9 * * *"
      timezone: Asia/Seoul
    cooldown:
      default-days: 2
      exclude:
        - "@apps-in-toss/web-framework"
    allow:
      - dependency-name: "@apps-in-toss/web-framework"
    open-pull-requests-limit: 1
