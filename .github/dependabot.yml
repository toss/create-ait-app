version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 * * *"
      timezone: Asia/Seoul
    allow:
      - dependency-name: create-vite
    cooldown:
      exclude:
        - create-vite
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    # .github 아래의 npm 버전 핀은 GitHub의 PR 파일 검증에서 거절돼요.
    # https://github.com/dependabot/dependabot-core/issues/15721
    directory: /version-pins
    schedule:
      interval: cron
      cronjob: "0 9 * * *"
      timezone: Asia/Seoul
    cooldown:
      default-days: 2
      exclude:
        - "@apps-in-toss/web-framework"
    allow:
      - dependency-name: "@apps-in-toss/web-framework"
    open-pull-requests-limit: 1
