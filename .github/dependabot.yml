version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 9 * * *"
      timezone: Asia/Seoul
    allow:
      - dependency-name: "@apps-in-toss/web-framework"
      - dependency-name: create-vite
      - dependency-name: skills
    cooldown:
      default-days: 3
      exclude:
        - create-vite
    open-pull-requests-limit: 3
