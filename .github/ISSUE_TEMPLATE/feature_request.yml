name: 기능 제안
description: 새로운 프리셋, 옵션, 예제 코드를 제안해 주세요
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        어떤 상황에서 필요한지 알려주시면 우선순위를 판단하는 데 도움이 돼요.

  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 지금은 어떤 점이 불편한지 알려주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
      description: 어떻게 동작하면 좋을지 알려주세요. 명령이나 옵션 예시가 있으면 더 좋아요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 다른 방법
      description: 지금 어떻게 우회하고 있는지, 다른 방법을 시도해 봤는지 알려주세요.
    validations:
      required: false
